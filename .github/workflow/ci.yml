name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Pytest Suite & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newtonite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DEBUG: "True"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/newtonite
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/newtonite_test
      JWT_SECRET_KEY: test-secret-key-min-32-characters-long-for-ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Create Test Database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d newtonite -c "CREATE DATABASE newtonite_test;"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Migrations on Main DB
        working-directory: backend
        run: |
          python -m alembic upgrade head

      - name: Run Full Backend Test Suite
        working-directory: backend
        run: |
          pytest -v tests --tb=short

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: TypeScript Typecheck & Vite Build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000/api/v1
        run: |
          npm run build
